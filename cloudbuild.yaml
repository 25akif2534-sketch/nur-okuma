steps:
  # 1. Docker imajını oluştur
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/nur-okuma', '.']

  # 2. Container Registry'ye yükle
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/nur-okuma']

  # 3. Google Cloud Run üzerinde yayına al
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'nur-okuma'
      - '--image'
      - 'gcr.io/$PROJECT_ID/nur-okuma'
      - '--region'
      - 'europe-west1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'

images:
  - 'gcr.io/$PROJECT_ID/nur-okuma'
